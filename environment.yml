# The analysis environment: everything that reads scores and makes figures.
# Versions are the ones the published runs used, read from the installed
# environment on 2026-11-20.
#
#   conda env create -f environment.yml
#   conda activate epitope-bench
#
# The folding and embedding work runs in a second environment, environment-gpu.yml,
# which pins a different torch. AlphaFold3 itself is a cluster module, not a
# package here; see the README.
name: epitope-bench
channels:
  - conda-forge
dependencies:
  - python=3.14.6
  - numpy=2.5.1
  - pandas=3.0.5
  - scipy=1.18.0
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
  - gemmi=0.7.5
  - pip
  - pip:
      - freesasa==2.2.1
